services:
  api:
    build: .
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
