<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InterviewCopilot</title>
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #eaeaea;
    }
    .container { text-align: center; padding: 40px; }
    h1 { font-size: 28px; margin-bottom: 10px; color: #00d9ff; }
    p.subtitle { font-size: 14px; color: #888; margin-bottom: 50px; }
    .btn {
      background: linear-gradient(135deg, #00d9ff 0%, #00a8cc 100%);
      border: none;
      padding: 18px 48px;
      font-size: 16px;
      font-weight: 600;
      color: #000;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 217, 255, 0.5); }
    #status {
      margin-top: 30px;
      padding: 15px 25px;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
      font-size: 14px;
    }
    .status.active { background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%); color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>InterviewCopilot</h1>
    <p class="subtitle">Invisible Screen-Sharing Assistant</p>
    <button id="startBtn" class="btn">Start Capture</button>
    <button id="stopBtn" class="btn" disabled>Stop Capture</button>
    <div id="status" class="status">Ready</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
